<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Usuarios - Ferremas</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Ocultar el botón de Usuarios en esta página */
        #btnUsuarios {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">🔨 FERREMAS</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='../HomeAdm/index.html'">Inicio</button>
            <button class="nav-btn" onclick="window.location.href='../HomeAdm/index.html?view=products'">Productos</button>
            <!--<button class="nav-btn" onclick="window.location.href='../CreateUserAdm/index.html'">Usuarios</button>-->
            <button class="nav-btn" onclick="logout()">Cerrar Sesión</button>
        </div>
    </nav>

    <!-- LISTADO USUARIOS -->
    <div id="userListView" class="view active">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h2>Usuarios Registrados</h2>
            <button class="btn" onclick="showView('createUserView')">Crear Usuario</button>
        </div>
        <div id="userTableContainer">
            <!-- Aquí se cargará la tabla de usuarios -->
        </div>
    </div>

    <!-- FORMULARIO CREAR USUARIO -->
    <div id="createUserView" class="view" style="display:none;">
        <h2>Crear Nuevo Usuario</h2>
        <div class="error-message" id="createUserError"></div>
        <div class="success-message" id="createUserSuccess"></div>
        <form onsubmit="registerUser(event)">
            <div class="form-group">
                <label for="rut">RUT:</label>
                <input type="text" id="rut" placeholder="12345678-9" required>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" placeholder="+56912345678">
            </div>
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="rol">Rol:</label>
                <select id="rol" required>
                    <option value="">Seleccione un rol</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Vendedor">Vendedor</option>
                    <option value="Bodeguero">Bodeguero</option>
                    <option value="Contador">Contador</option>
                </select>
            </div>
            <button type="submit" class="btn">Registrar Usuario</button>
            <button type="button" class="btn btn-secondary" onclick="showView('userListView')">Cancelar</button>
        </form>
    </div>
</div>

<!-- Notificación -->
<div id="customSuccess" class="success-alert" style="display:none;">
    <span id="successMessage"></span>
</div>

<script src="script.js"></script>
</body>
</html>
